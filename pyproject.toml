[project]
name = "memory-test"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django==5.1.1",
    "djangorestframework>=3.17.1",
    "python-dotenv==1.0.1",
]


[tool.ruff]
line-length = 79
exclude = [
    ".gitignore",
    "__pycache__",
    ".venv",
    "manage.py",
    "backend/settings.py"
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]


[tool.ruff.format]
quote-style = "single"

[tool.isort]
profile = "django"

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "ruff>=0.16.0",
]
