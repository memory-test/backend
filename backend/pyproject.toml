[tool.ruff]
line-length = 79
exclude = [
    ".venv",
    "venv",
    "manage.py",
    "*/migrations"
]

[tool.ruff.lint]
select = ["E", "W", "F"]

[tool.ruff.lint.per-file-ignores]
"*/settings.py" = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.isort]
profile = "black"
line_length = 79
src_paths = ["."]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "backend.settings"