user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

load_module modules/ngx_http_acme_module.so;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip  on;

    # Docker's embedded DNS: resolves other compose services AND forwards
    # external names (e.g. the ACME directory) to the host's upstream resolvers.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # ACME issuer configuration
    acme_issuer letsencrypt {
        uri         https://acme-v02.api.letsencrypt.org/directory;
        contact     ${ACME_EMAIL};
        state_path  /var/cache/nginx/acme;
        accept_terms_of_service;

        # Uncomment for staging/testing
        # uri         https://acme-staging-v02.api.letsencrypt.org/directory;
    }

    # Shared memory zone for ACME certificates
    acme_shared_zone zone=acme_zone:1M;

    # HTTP server for ACME challenge
    server {
        listen 80;
        server_name ${ACME_DOMAIN_NAME};

        # ACME challenge location
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
        }

        # Redirect all other HTTP requests to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
     }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name ${ACME_DOMAIN_NAME};

        # ACME certificate configuration
        acme_certificate letsencrypt;

        # Use variables for certificate paths
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;

        # Cache certificates for better performance
        ssl_certificate_cache max=10;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Proxy configurations
        location /api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass http://backend:8000/api/;
        }

        location /admin/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass http://backend:8000/admin/;
        }

        location /static/ {
            alias /var/www/django/static/;
            index index.html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /var/www/django/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /dozzle {
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass http://dozzle:8080/;
        }

        location / {
            root /var/www/frontend;
            try_files $uri $uri/ /index.html;
        }

    }

}



